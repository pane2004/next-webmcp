name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        # examples/* is in the workspace; mirrors vercel.json's installCommand.
        run: pnpm install --frozen-lockfile=false

      - name: Lint (prettier)
        run: pnpm lint

      - name: Build library
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck && pnpm typecheck:examples

      - name: Test
        run: pnpm test

      - name: Build examples/commerce (mock mode, no env)
        run: pnpm --filter example-commerce build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
